<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a102a">
  <title>XaDa — Presence</title>
  <meta name="description" content="XaDa — creator, streamer and digital artist.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="rune-particles" aria-hidden="true"></canvas>
  <div class="norse-frame" aria-hidden="true"></div>

  <main class="page">
    <header class="hero">
      <div class="rune-mark" aria-hidden="true">ᛉ</div>
      <img class="site-logo" src="" alt="XaDa" hidden>
      <h1 data-config="siteName">XaDa</h1>
      <p data-config="tagline">CREATE · EXPLORE · SHARE</p>
    </header>

    <section class="store" aria-label="Featured Jinxxy products">
      <div class="section-head">
        <div>
          <span class="eyebrow">JINXXY STORE <span id="product-count" hidden></span></span>
          <h2>Featured creations</h2>
        </div>
        <a class="store-link" href="https://jinxxy.com/XaDa" target="_blank" rel="noopener noreferrer">View store ↗</a>
      </div>

      <div class="store-window" id="store-window" aria-live="polite"></div>
      <div class="store-controls" id="store-controls" aria-label="Store carousel controls"></div>
    </section>

    <section class="links" aria-label="Social links">
      <a href="https://www.youtube.com/@xadatv" target="_blank" rel="noopener noreferrer"><span class="symbol">▶</span><span><strong>YouTube</strong><small>Videos & content</small></span><b>↗</b></a>
      <a href="https://www.twitch.tv/xadatv" target="_blank" rel="noopener noreferrer"><span class="symbol">◈</span><span><strong>Twitch</strong><small>Live streams</small></span><b>↗</b></a>
      <a href="https://x.com/xadatv" target="_blank" rel="noopener noreferrer"><span class="symbol">𝕏</span><span><strong>X / Twitter</strong><small>Updates & thoughts</small></span><b>↗</b></a>
      <a href="https://www.instagram.com/xadatv" target="_blank" rel="noopener noreferrer"><span class="symbol">◎</span><span><strong>Instagram</strong><small>Behind the scenes</small></span><b>↗</b></a>
      <a class="primary store-link" href="https://jinxxy.com/XaDa" target="_blank" rel="noopener noreferrer"><span class="symbol">✦</span><span><strong>Jinxxy</strong><small>Assets & creations</small></span><b>↗</b></a>
    </section>

    <footer>
      <span>ᛟ</span>
      <p>BETTER TO STAND ALONE<br>THAN TO FALL WITH THE CROWD</p>
      <small>© 2026 XaDa</small>
    </footer>
  </main>

  <button class="sound-toggle" type="button" aria-pressed="false" aria-label="Play ambient music"><span>ᛞ</span> AMBIENCE</button>
  <audio id="ambient-audio" loop preload="none"></audio>
  <script src="site-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
