name = "xada-jinxxy-proxy"
main = "worker.js"
compatibility_date = "2026-08-11"

# Keep the Jinxxy API key OUT of this file.
# Set it with: npx wrangler secret put JINXXY_API_KEY

[vars]
# For a quick setup you can leave this as *.
# For production, replace it with your exact website origin, e.g.
# ALLOWED_ORIGIN = "https://xada.example.com"
ALLOWED_ORIGIN = "*"
